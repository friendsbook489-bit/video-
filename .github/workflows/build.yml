name: Build APK from ZIP
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        shell: bash
        run: |
          ZIP=$(ls *.zip 2>/dev/null | head -n 1)
          echo "ZIP file: $ZIP"
          [ -z "$ZIP" ] && { echo "::error::repository তে কোনো .zip ফাইল নেই"; exit 1; }
          mkdir -p project
          unzip -q -o "$ZIP" -d project
          SETTINGS=$(find project -name "settings.gradle.kts" | head -n 1)
          [ -z "$SETTINGS" ] && { echo "::error::জিপের ভেতরে settings.gradle.kts পাওয়া যায়নি"; find project | head -50; exit 1; }
          echo "DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        shell: bash
        working-directory: ${{ env.DIR }}
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build-log.txt

      - name: Save build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ env.DIR }}/build-log.txt
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MedulDownloader-APK
          path: ${{ env.DIR }}/app/build/outputs/apk/debug/*.apk

      - name: Rename APK
        shell: bash
        run: cp ${{ env.DIR }}/app/build/outputs/apk/debug/*.apk MedulDownloader.apk

      - name: Publish Release (সরাসরি APK ডাউনলোড লিংক)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Medul Downloader v${{ github.run_number }}
          files: MedulDownloader.apk

